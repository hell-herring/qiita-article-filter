name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint / Format / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # package-lock.json はリポジトリに含めていないため npm ci ではなく npm install
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Test
        run: npm test

      # アイコンは scripts/generate-icons.mjs の出力とコミット内容が一致しているべき
      - name: Icons are up to date
        run: |
          npm run icons
          git diff --exit-code -- icons
